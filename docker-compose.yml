services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: disaster_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./data/config.py:/data/config.py
      - ./data/pipeline.py:/data/pipeline.py
    environment:
      - CHOKIDAR_USEPOLLING=true

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: disaster_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true